name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: irislobato
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Adjust snake contrast
        run: |
          sed -i 's/--cs:#c084fc/--cs:#a967d5/g' dist/github-contribution-grid-snake-dark.svg

      - name: Push snake
        uses: EndBug/add-and-commit@v9
        with:
          message: "Update contribution snake"
          add: "dist/"
